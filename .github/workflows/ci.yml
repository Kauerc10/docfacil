# CI — roda em todo Pull Request e push para main/24.
# Barreira mínima: o PR só mergeia se tudo aqui passar verde.
name: CI

on:
  pull_request:
    branches: [main, 24]
  push:
    branches: [main, 24]

# Cancela runs antigas da mesma branch quando um novo push chega.
# Economiza minutos de CI e evira resultado stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test + Lint + TypeCheck + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: ☕ Setup Java (para Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Cache da pasta .bun para installs subsequentes voarem.
      - name: 💾 Cache bun
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: 📦 Install dependências
        run: bun install --frozen-lockfile

      - name: 🧪 Testes unitários do Backend e Domínio
        run: bun run test

      - name: 🛡️ Testes de Firestore Security Rules
        run: bun run test:rules

      - name: 🔥 Integração Firestore — commit atômico
        run: bun run test:firestore-commit

      - name: 🔍 ESLint
        run: bun run lint
        continue-on-error: false

      - name: 🔬 TypeScript (typecheck)
        run: bun run typecheck

      - name: 🏗️ Next.js Build
        run: bun run build:ci
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ""
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ""
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "docfacil-ci"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ""
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ""
          NEXT_PUBLIC_FIREBASE_APP_ID: ""
          FIREBASE_PROJECT_ID: "docfacil-ci"
          R2_BUCKET_NAME: "docfacil-pdfs"

  e2e:
    name: Guest E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - run: bun install --frozen-lockfile

      - run: bunx playwright install --with-deps chromium

      - run: bun run test:e2e
