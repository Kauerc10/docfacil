name: Atualiza lock do medidor de senha

on:
  push:
    branches:
      - fix/auth-login-session-hardening
    paths:
      - .github/workflows/update-auth-password-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: fix/auth-login-session-hardening

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Atualizar bun.lock
        run: bun install

      - name: Commitar lock quando necessário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "bun.lock já estava atualizado"
          else
            git commit -m "chore(auth): atualiza lock do medidor de senha"
            git push origin HEAD:fix/auth-login-session-hardening
          fi
