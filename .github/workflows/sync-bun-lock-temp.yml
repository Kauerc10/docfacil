name: Sync Bun Lock (temporary)

on:
  push:
    branches:
      - feat/modelos-codigo-fonte-da-verdade

permissions:
  contents: write

concurrency:
  group: sync-bun-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/modelos-codigo-fonte-da-verdade
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Regenerate bun.lock
        run: bun install

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): sync bun lockfile for firebase-admin 13.10"
          git push origin HEAD:feat/modelos-codigo-fonte-da-verdade
